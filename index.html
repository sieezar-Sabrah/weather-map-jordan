<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام خرائط الطقس 2026</title>
    <link rel="stylesheet" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        /* إعدادات حاسمة لظهور الخريطة */
        html, body { height: 100%; margin: 0; padding: 0; }
        .wrapper { display: flex; height: 100vh; flex-direction: column; }
        header { background: #1f2937; color: white; padding: 10px; text-align: center; }
        .main { display: flex; flex: 1; overflow: hidden; }
        #sidebar { width: 300px; padding: 15px; background: #f4f4f4; border-left: 1px solid #ccc; overflow-y: auto; }
        
        /* هذا الجزء هو الأهم لظهور الخريطة */
        #map { flex: 1; height: 100%; min-height: 100%; background: #ddd; }

        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; }
        input, select, button { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; }
        button { background: #2563eb; color: white; cursor: pointer; border: none; }
        button:hover { background: #1d4ed8; }
        .clear-btn { background: #dc2626; margin-top: 5px; }
    </style>
</head>
<body>

<div class="wrapper">
    <header><h1>نظام التحذيرات الجوية - الأردن 2026</h1></header>
    <div class="main">
        <aside id="sidebar">
            <div class="form-group">
                <label>1. ارفع صورة الخريطة من جهازك</label>
                <input type="file" id="imgInput" accept="image/*">
            </div>
            <hr>
            <div class="form-group">
                <label>2. نوع التحذير</label>
                <select id="alertType">
                    <option value="ثلوج">❄️ ثلوج</option>
                    <option value="أمطار">🌧️ أمطار غزيرة</option>
                    <option value="رياح">💨 رياح قوية</option>
                </select>
            </div>
            <div class="form-group">
                <label>3. الشدة</label>
                <select id="severity">
                    <option value="extreme">🔴 شديد جداً</option>
                    <option value="high">🟠 عالٍ</option>
                    <option value="moderate">🟡 متوسط</option>
                </select>
            </div>
            <button onclick="exportData()">تصدير البيانات (GeoJSON)</button>
            <button class="clear-btn" onclick="clearMap()">مسح كل شيء</button>
        </aside>

        <!-- حاوية الخريطة -->
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<script>
    // 1. تشغيل الخريطة فوراً
    var map = L.map('map').setView([31.24, 36.51], 7);

    // 2. إضافة طبقة الخريطة (قمر صناعي أو طرق)
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // 3. أدوات الرسم
    var drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: { polyline: false, circlemarker: false }
    });
    map.addControl(drawControl);

    // 4. رفع الصورة ووضعها على الخريطة
    var overlay = null;
    document.getElementById('imgInput').onchange = function(e) {
        var reader = new FileReader();
        reader.onload = function(event) {
            var img = new Image();
            img.onload = function() {
                // وضع الصورة في مركز الأردن تلقائياً بمساحة معقولة
                var bounds = [[29.5, 34.5], [33.5, 39.5]];
                if (overlay) map.removeLayer(overlay);
                overlay = L.imageOverlay(event.target.result, bounds, { opacity: 0.7 }).addTo(map);
                map.fitBounds(bounds); // التركيز على الصورة فور رفعها
                alert("تم رفع الخريطة بنجاح! يمكنك الآن الرسم فوقها.");
            };
            img.src = event.target.result;
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // 5. حفظ الرسوم
    map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        var type = document.getElementById('alertType').value;
        var sev = document.getElementById('severity').value;
        
        var color = sev === 'extreme' ? 'red' : (sev === 'high' ? 'orange' : 'yellow');
        layer.setStyle({ color: 'black', fillColor: color, fillOpacity: 0.5 });
        layer.bindPopup("تحذير: " + type).openPopup();
        
        layer.feature = { properties: { type: type, severity: sev } };
        drawnItems.addLayer(layer);
    });

    // 6. وظائف الأزرار
    function exportData() {
        var data = drawnItems.toGeoJSON();
        var blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'weather_2026.geojson'; a.click();
    }

    function clearMap() {
        if(confirm("مسح؟")) {
            drawnItems.clearLayers();
            if(overlay) map.removeLayer(overlay);
        }
    }

    // حل مشكلة عدم ظهور الخريطة عند التحميل الأولي
    window.onload = function() {
        setTimeout(function(){ map.invalidateSize(); }, 500);
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام التحذيرات الجوية - الأردن</title>

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com" />
  <!-- Leaflet Draw CSS -->
  <link rel="stylesheet" href="https://unpkg.com" />

  <style>
    /* أهم جزء لظهور الخريطة */
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; }
    
    .main-wrapper { display: flex; flex-direction: column; height: 100vh; }
    header { background: #1f2937; color: white; padding: 15px; z-index: 1000; }
    
    .container { display: grid; grid-template-columns: 320px 1fr; flex-grow: 1; overflow: hidden; }
    
    #sidebar { background: white; padding: 20px; border-left: 1px solid #ddd; overflow-y: auto; z-index: 1000; }
    
    /* تحديد طول الخريطة بدقة */
    #map { width: 100%; height: 100%; background: #e5e7eb; }

    .group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    select, input, button { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    .btn-export { background: #2563eb; color: white; border: none; cursor: pointer; margin-top: 10px; }
    .btn-clear { background: #ef4444; color: white; border: none; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

<div class="main-wrapper">
  <header>
    <h1 style="margin:0; font-size: 1.2rem;">خريطة التحذيرات الجوية - الأردن (2026)</h1>
  </header>

  <div class="container">
    <aside id="sidebar">
      <div class="group">
        <label>نوع التحذير</label>
        <select id="alertType">
          <option value="rain">🌧️ أمطار غزيرة</option>
          <option value="snow">❄️ ثلوج</option>
          <option value="storm">⛈️ عواصف رعدية</option>
          <option value="flood">🌊 سيول</option>
        </select>
      </div>
      <div class="group">
        <label>الشدة</label>
        <select id="severity">
          <option value="low">منخفض</option>
          <option value="moderate">متوسط</option>
          <option value="high">عالٍ</option>
          <option value="extreme">شديد جداً</option>
        </select>
      </div>
      <div class="group">
        <label>وصف</label>
        <input type="text" id="description" placeholder="اكتب تفاصيل هنا...">
      </div>
      <button id="exportBtn" class="btn-export">تصدير GeoJSON</button>
      <button id="clearBtn" class="btn-clear">مسح الخريطة</button>
    </aside>

    <div id="map"></div>
  </div>
</div>

<!-- تحميل السكريبتات بالترتيب الصحيح -->
<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<script>
  // 1. تعريف الخريطة
  var map = L.map('map').setView([31.24, 36.51], 7);

  // 2. إضافة الطبقة الأساسية
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  // 3. طبقة الرسم
  var drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  // 4. أدوات التحكم بالرسم
  var drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems },
    draw: { polyline: false, circlemarker: false }
  });
  map.addControl(drawControl);

  // 5. الألوان
  const colors = { low: '#9ae6b4', moderate: '#f6e05e', high: '#f6ad55', extreme: '#fc8181' };

  // 6. منطق الرسم
  map.on(L.Draw.Event.CREATED, function (e) {
    var layer = e.layer;
    var sev = document.getElementById('severity').value;
    var type = document.getElementById('alertType').value;
    var desc = document.getElementById('description').value;

    layer.setStyle({ fillColor: colors[sev], fillOpacity: 0.6, color: '#000', weight: 1 });
    layer.bindPopup("<b>نوع التحذير:</b> " + type + "<br><b>الشدة:</b> " + sev + "<br>" + desc);
    
    // تخزين الخصائص داخل العنصر
    layer.feature = { properties: { severity: sev, alertType: type, description: desc } };
    drawnItems.addLayer(layer);
  });

  // 7. تصدير الملف
  document.getElementById('exportBtn').onclick = function() {
    var data = drawnItems.toGeoJSON();
    var blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'jordan-weather-2026.geojson';
    a.click();
  };

  // 8. مسح الخريطة
  document.getElementById('clearBtn').onclick = function() {
    drawnItems.clearLayers();
  };

  // معالجة مشكلة الحجم عند التحميل
  setTimeout(function(){ map.invalidateSize(); }, 400);
</script>

</body>
</html>

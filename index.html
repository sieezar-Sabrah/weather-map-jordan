<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام خرائط الطقس - جوجل إيرث الأردن 2026</title>
    
    <!-- مكتبات Leaflet الأساسية -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Tahoma', sans-serif; }
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        #sidebar { 
            width: 320px; background: #1a1a1a; color: white; padding: 20px; 
            z-index: 2000; display: flex; flex-direction: column; box-shadow: 2px 0 10px rgba(0,0,0,0.5);
        }

        #map-container { flex: 1; position: relative; height: 100%; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; }

        .control-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #ccc; }
        input, select, button { width: 100%; padding: 12px; border: none; border-radius: 8px; margin-bottom: 10px; }
        
        button { background: #28a745; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background: #218838; }
        .btn-danger { background: #dc3545; }
        
        .status { margin-top: auto; padding: 10px; background: #333; font-size: 0.8rem; border-radius: 5px; color: #00ff00; border: 1px solid #444; }
        h3 { color: #fff; border-bottom: 1px solid #444; padding-bottom: 10px; text-align: center; }
    </style>
</head>
<body>

<div class="app-container">
    <aside id="sidebar">
        <h3>رصد طقس الأردن 2026</h3>
        
        <div class="control-group">
            <label>1. نوع الخريطة</label>
            <select id="mapType" onchange="changeMapType()">
                <option value="satellite">جوجل إيرث (قمر صناعي)</option>
                <option value="hybrid">جوجل (هجين - طرق وأسماء)</option>
                <option value="streets">جوجل (خرائط الشوارع)</option>
            </select>
        </div>

        <div class="control-group">
            <label>2. رفع خريطة ضغط/أمطار (اختياري)</label>
            <input type="file" id="uploadImg" accept="image/*">
        </div>

        <div class="control-group">
            <label>3. درجة التحذير للرسم</label>
            <select id="severity">
                <option value="#ff0000">🔴 منطقة خطر شديد</option>
                <option value="#ff8c00">🟠 منطقة تحذير</option>
                <option value="#ffff00">🟡 منطقة تنبيه</option>
            </select>
        </div>

        <button onclick="downloadJSON()">تصدير كملف GeoJSON</button>
        <button class="btn-danger" onclick="resetMap()">مسح الكل</button>

        <div class="status" id="statusLine">النظام متصل بجوجل إيرث...</div>
    </aside>

    <div id="map-container">
        <div id="map"></div>
    </div>
</div>

<script src="https://unpkg.com"></script>
<script src="https://cdnjs.cloudflare.com"></script>

<script>
    // 1. تعريف طبقات خرائط جوجل
    var googleSat = L.tileLayer('http://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',{ maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'], attribution: '&copy; Google Earth 2026' });
    var googleHybrid = L.tileLayer('http://{s}.google.com/vt/lyrs=s,h&x={x}&y={y}&z={z}',{ maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] });
    var googleStreets = L.tileLayer('http://{s}.google.com/vt/lyrs=m&x={x}&y={y}&z={z}',{ maxZoom: 20, subdomains:['mt0','mt1','mt2','mt3'] });

    // 2. إنشاء الخريطة والتركيز على الأردن
    var map = L.map('map', { center: [31.2, 36.5], zoom: 7, layers: [googleSat] }); // إحداثيات مركز الأردن تقريباً
    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // 3. أدوات الرسم
    var drawControl = new L.Control.Draw({ edit: { featureGroup: drawnItems }, draw: { polyline: true, polygon: true, rectangle: true, circle: true, marker: false } });
    map.addControl(drawControl);

    // 4. تغيير نوع الخريطة
    function changeMapType() {
        var type = document.getElementById('mapType').value;
        map.removeLayer(googleSat);
        map.removeLayer(googleHybrid);
        map.removeLayer(googleStreets);
        
        if(type === 'satellite') googleSat.addTo(map);
        if(type === 'hybrid') googleHybrid.addTo(map);
        if(type === 'streets') googleStreets.addTo(map);
    }

    // 5. رفع صورة فوق خرائط جوجل
    var imgOverlay = null;
    document.getElementById('uploadImg').onchange = function(e) {
        var reader = new FileReader();
        reader.onload = function(event) {
            var bounds = [[29.18, 34.95], [33.37, 39.30]]; // حدود الأردن الدقيقة
            if (imgOverlay) map.removeLayer(imgOverlay);
            imgOverlay = L.imageOverlay(event.target.result, bounds, { opacity: 0.5 }).addTo(map);
            map.fitBounds(bounds);
            document.getElementById('statusLine').innerText = "تم دمج صورة الطقس فوق جوجل إيرث";
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // 6. تلوين المناطق المرسومة
    map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        var color = document.getElementById('severity').value;
        layer.setStyle({ fillColor: color, fillOpacity: 0.4, color: color, weight: 2 });
        drawnItems.addLayer(layer);
    });

    // 7. تصدير البيانات ومسح الخريطة
    function downloadJSON() {
        var data = drawnItems.toGeoJSON();
        var blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url; a.download = 'Jordan_Weather_Analysis_2026.geojson'; a.click();
    }

    function resetMap() {
        if(confirm("هل تريد مسح جميع البيانات؟")) {
            drawnItems.clearLayers();
            if(imgOverlay) map.removeLayer(imgOverlay);
            document.getElementById('statusLine').innerText = "تم مسح البيانات";
        }
    }

    window.onload = function() { setTimeout(function(){ map.invalidateSize(); }, 500); };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>نظام خرائط الطقس - الأردن 2026</title>
    <!-- روابط CDN بديلة وسريعة جداً -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Tahoma', sans-serif; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* القائمة الجانبية */
        #sidebar { 
            width: 320px; 
            background: #ffffff; 
            border-left: 2px solid #ddd; 
            padding: 20px; 
            z-index: 2000; 
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
        }

        /* حاوية الخريطة - تأكيد العرض والطول */
        #map-container { flex: 1; position: relative; height: 100%; background: #eee; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; }

        .control-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; }
        
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; margin-top: 10px; }
        
        .status { margin-top: auto; padding: 10px; background: #f8f9fa; font-size: 0.8rem; border-radius: 5px; }
    </style>
</head>
<body>

<div class="app-container">
    <aside id="sidebar">
        <h3>التحكم بالخريطة</h3>
        
        <div class="control-group">
            <label>1. ارفع خريطة (صورة) من جهازك</label>
            <input type="file" id="uploadImg" accept="image/*">
        </div>

        <div class="control-group">
            <label>2. إعدادات الرسم</label>
            <select id="severity">
                <option value="red">🔴 خطر شديد</option>
                <option value="orange">🟠 تحذير متوسط</option>
                <option value="yellow">🟡 تنبيه منخفض</option>
            </select>
        </div>

        <button onclick="downloadJSON()">تصدير الخريطة (GeoJSON)</button>
        <button class="btn-danger" onclick="resetMap()">مسح كافة البيانات</button>

        <div class="status" id="statusLine">الحالة: الخريطة جاهزة</div>
    </aside>

    <div id="map-container">
        <div id="map"></div>
    </div>
</div>

<!-- تحميل السكريبتات من روابط JSDelivr البديلة -->
<script src="https://cdn.jsdelivr.net"></script>
<script src="https://cdnjs.cloudflare.com"></script>

<script>
    // 1. إنشاء الخريطة مع خيار "تجنب التلاشي الرمادي"
    var map = L.map('map', {
        center: [31.24, 36.51],
        zoom: 7,
        fadeAnimation: false 
    });

    // 2. استخدام خريطة CartoDB (تعمل بشكل أفضل في المناطق العربية)
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // 3. أدوات الرسم
    var drawControl = new L.Control.Draw({
        edit: { featureGroup: drawnItems },
        draw: { polyline: false, marker: false, circlemarker: false }
    });
    map.addControl(drawControl);

    // 4. رفع الصورة وتركيبها
    var imgOverlay = null;
    document.getElementById('uploadImg').onchange = function(e) {
        var reader = new FileReader();
        reader.onload = function(event) {
            var bounds = [[29.0, 34.0], [33.5, 39.5]]; // إحداثيات تغطي الأردن
            if (imgOverlay) map.removeLayer(imgOverlay);
            imgOverlay = L.imageOverlay(event.target.result, bounds, { opacity: 0.7 }).addTo(map);
            map.fitBounds(bounds);
            document.getElementById('statusLine').innerText = "الحالة: تم رفع الصورة بنجاح";
        };
        reader.readAsDataURL(e.target.files[0]);
    };

    // 5. عند الرسم
    map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        var color = document.getElementById('severity').value;
        layer.setStyle({ fillColor: color, fillOpacity: 0.5, color: "black", weight: 1 });
        drawnItems.addLayer(layer);
    });

    // 6. وظائف الأزرار
    function downloadJSON() {
        var data = drawnItems.toGeoJSON();
        var blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'jordan-weather-2026.geojson';
        link.click();
    }

    function resetMap() {
        if(confirm("هل تريد مسح الخريطة؟")) {
            drawnItems.clearLayers();
            if(imgOverlay) map.removeLayer(imgOverlay);
            document.getElementById('statusLine').innerText = "الحالة: تم المسح";
        }
    }

    // الحل النهائي لضمان عدم ظهور اللون السكني
    window.onload = function() {
        setTimeout(function() {
            map.invalidateSize();
            console.log("Map size refreshed.");
        }, 500);
    };
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>نظام التحذيرات الجوية - رفع خريطة خاصة</title>

  <link rel="stylesheet" href="https://unpkg.com" />
  <link rel="stylesheet" href="https://unpkg.com" />

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: sans-serif; }
    .main-wrapper { display: flex; flex-direction: column; height: 100vh; }
    header { background: #1f2937; color: white; padding: 10px 20px; z-index: 1000; }
    .container { display: grid; grid-template-columns: 320px 1fr; flex-grow: 1; overflow: hidden; }
    #sidebar { background: #f9fafb; padding: 20px; border-left: 1px solid #ddd; overflow-y: auto; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    #map { width: 100%; height: 100%; background: #e5e7eb; }
    .group { margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
    label { display: block; margin-bottom: 5px; font-weight: bold; color: #374151; }
    select, input, button { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    .btn-upload { background: #059669; color: white; border: none; cursor: pointer; margin-top: 5px; }
    .btn-export { background: #2563eb; color: white; border: none; cursor: pointer; margin-top: 10px; }
    .btn-clear { background: #ef4444; color: white; border: none; cursor: pointer; margin-top: 5px; }
    .info-text { font-size: 0.8rem; color: #6b7280; margin-top: 5px; }
  </style>
</head>
<body>

<div class="main-wrapper">
  <header>
    <h1 style="margin:0; font-size: 1.1rem;">نظام التحذيرات الجوية - إضافة خريطة كصورة (2026)</h1>
  </header>

  <div class="container">
    <aside id="sidebar">
      
      <div class="group">
        <label>1. تحميل خريطة من جهازك</label>
        <input type="file" id="imageInput" accept="image/*">
        <p class="info-text">اختر صورة (JPG/PNG) لتظهر كخلفية للخريطة.</p>
      </div>

      <div class="group">
        <label>2. إعدادات التحذير</label>
        <label style="font-weight: normal; font-size: 0.9rem;">نوع التحذير</label>
        <select id="alertType">
          <option value="rain">🌧️ أمطار غزيرة</option>
          <option value="snow">❄️ ثلوج</option>
          <option value="wind">💨 رياح قوية</option>
          <option value="flood">🌊 سيول</option>
        </select>
        
        <label style="font-weight: normal; font-size: 0.9rem; margin-top: 10px;">الشدة</label>
        <select id="severity">
          <option value="low">منخفض</option>
          <option value="moderate">متوسط</option>
          <option value="high">عالٍ</option>
          <option value="extreme">شديد جداً</option>
        </select>
      </div>

      <div class="group">
        <label>3. التحكم</label>
        <button id="exportBtn" class="btn-export">تصدير التحذيرات (GeoJSON)</button>
        <button id="clearBtn" class="btn-clear">مسح كافة الرسوم</button>
      </div>
    </aside>

    <div id="map"></div>
  </div>
</div>

<script src="https://unpkg.com"></script>
<script src="https://unpkg.com"></script>

<script>
  // 1. إنشاء الخريطة
  var map = L.map('map').setView([31.24, 36.51], 7);

  // خريطة أساسية خفيفة
  var baseLayer = L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
    attribution: '&copy; OpenStreetMap'
  }).addTo(map);

  var drawnItems = new L.FeatureGroup();
  map.addLayer(drawnItems);

  // 2. منطق رفع الصورة وتحويلها إلى خريطة
  var currentImageOverlay = null;

  document.getElementById('imageInput').addEventListener('change', function(e) {
    var file = e.target.files[0];
    if (!file) return;

    var reader = new FileReader();
    reader.onload = function(event) {
      var imageUrl = event.target.result;

      // تحديد حدود الصورة (مثلاً سيتم وضعها فوق حدود الأردن تقريباً)
      // يمكنك تغيير هذه الإحداثيات لتناسب حجم صورتك
      var imageBounds = [[29.1, 34.9], [33.4, 39.3]]; 

      // إذا كانت هناك صورة سابقة، قم بإزالتها
      if (currentImageOverlay) {
        map.removeLayer(currentImageOverlay);
      }

      // إضافة الصورة كطبقة فوق الخريطة
      currentImageOverlay = L.imageOverlay(imageUrl, imageBounds, {
        opacity: 0.8,
        interactive: true
      }).addTo(map);

      // تقريب الخريطة للصورة المرفوعة
      map.fitBounds(imageBounds);
      alert("تم رفع الصورة. يمكنك الآن الرسم فوقها.");
    };
    reader.readAsDataURL(file);
  });

  // 3. أدوات الرسم
  var drawControl = new L.Control.Draw({
    edit: { featureGroup: drawnItems },
    draw: { polyline: false, circlemarker: false, circle: true }
  });
  map.addControl(drawControl);

  const colors = { low: '#9ae6b4', moderate: '#f6e05e', high: '#f6ad55', extreme: '#fc8181' };

  map.on(L.Draw.Event.CREATED, function (e) {
    var layer = e.layer;
    var sev = document.getElementById('severity').value;
    var type = document.getElementById('alertType').value;

    layer.setStyle({ fillColor: colors[sev], fillOpacity: 0.5, color: '#000', weight: 2 });
    layer.bindPopup("<b>التحذير:</b> " + type + "<br><b>الشدة:</b> " + sev);
    
    layer.feature = { properties: { severity: sev, alertType: type } };
    drawnItems.addLayer(layer);
  });

  // 4. التصدير والمسح
  document.getElementById('exportBtn').onclick = function() {
    var data = drawnItems.toGeoJSON();
    if (data.features.length === 0) return alert("ارسم شيئاً أولاً!");
    var blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'weather_data_2026.geojson';
    a.click();
  };

  document.getElementById('clearBtn').onclick = function() {
    if(confirm("سيتم مسح جميع الرسومات، هل أنت متأكد؟")) drawnItems.clearLayers();
  };

  // إصلاح أبعاد الخريطة عند التحميل
  setTimeout(() => { map.invalidateSize(); }, 500);
</script>

</body>
</html>

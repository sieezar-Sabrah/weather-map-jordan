<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام خرائط الطقس - الأردن 2026</title>
    
    <!-- تحميل مكتبة Leaflet الأساسية -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <!-- تحميل مكتبة أدوات الرسم -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com" />
    
    <style>
        * { box-sizing: border-box; }
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; font-family: 'Tahoma', sans-serif; }
        
        .app-container { display: flex; height: 100vh; width: 100vw; }
        
        /* القائمة الجانبية */
        #sidebar { 
            width: 320px; 
            background: #ffffff; 
            border-left: 2px solid #ddd; 
            padding: 20px; 
            z-index: 2000; 
            display: flex;
            flex-direction: column;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            overflow-y: auto;
        }

        /* حاوية الخريطة */
        #map-container { flex: 1; position: relative; height: 100%; background: #f0f0f0; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; width: 100%; height: 100%; }

        .control-group { margin-bottom: 20px; }
        label { display: block; font-weight: bold; margin-bottom: 8px; font-size: 0.9rem; color: #333; }
        input, select, button { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 8px; font-family: inherit; }
        
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; transition: 0.3s; margin-bottom: 10px; }
        button:hover { background: #0056b3; }
        .btn-danger { background: #dc3545; }
        .btn-danger:hover { background: #a71d2a; }
        
        .status { margin-top: auto; padding: 10px; background: #e9ecef; font-size: 0.85rem; border-radius: 5px; text-align: center; border: 1px solid #ced4da; }
        h3 { margin-top: 0; color: #007bff; border-bottom: 2px solid #eee; padding-bottom: 10px; }
    </style>
</head>
<body>

<div class="app-container">
    <aside id="sidebar">
        <h3>نظام طقس الأردن 2026</h3>
        
        <div class="control-group">
            <label>1. ارفع خريطة سينوبتيكية (Image)</label>
            <input type="file" id="uploadImg" accept="image/*">
        </div>

        <div class="control-group">
            <label>2. درجة خطورة المنطقة المرسومة</label>
            <select id="severity">
                <option value="red">🔴 خطر شديد (عواصف/ثلوج)</option>
                <option value="orange">🟠 تحذير متوسط (غبار/أمطار)</option>
                <option value="yellow">🟡 تنبيه منخفض (رياح نشطة)</option>
                <option value="green">🟢 مستقر</option>
            </select>
        </div>

        <button onclick="downloadJSON()">تصدير البيانات (GeoJSON)</button>
        <button class="btn-danger" onclick="resetMap()">مسح الخريطة بالكامل</button>

        <div class="status" id="statusLine">الحالة: الخريطة جاهزة للاستخدام</div>
    </aside>

    <div id="map-container">
        <div id="map"></div>
    </div>
</div>

<!-- تحميل السكريبتات بالترتيب الصحيح -->
<script src="https://unpkg.com"></script>
<script src="https://cdnjs.cloudflare.com"></script>

<script>
    // 1. إعداد الخريطة والتركيز على الأردن
    var map = L.map('map', {
        center: [31.24, 36.51],
        zoom: 7,
        fadeAnimation: true 
    });

    // 2. إضافة طبقة الخريطة (CartoDB Light)
    L.tileLayer('https://{s}://{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org">OpenStreetMap</a> contributors &copy; <a href="https://carto.com">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 20
    }).addTo(map);

    // 3. إعداد طبقة الرسم
    var drawnItems = new L.FeatureGroup();
    map.addLayer(drawnItems);

    // 4. تفعيل أدوات الرسم (المضلعات والدوائر)
    var drawControl = new L.Control.Draw({
        edit: {
            featureGroup: drawnItems
        },
        draw: {
            polygon: true,
            polyline: false,
            rectangle: true,
            circle: true,
            marker: false,
            circlemarker: false
        }
    });
    map.addControl(drawControl);

    // 5. وظيفة رفع صورة فوق الخريطة (Overlay)
    var imgOverlay = null;
    document.getElementById('uploadImg').onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;

        var reader = new FileReader();
        reader.onload = function(event) {
            // إحداثيات تغطي حدود المملكة الأردنية الهاشمية تقريباً
            var bounds = [[29.1, 34.2], [33.5, 39.3]]; 
            
            if (imgOverlay) map.removeLayer(imgOverlay);
            
            imgOverlay = L.imageOverlay(event.target.result, bounds, { 
                opacity: 0.6,
                interactive: false 
            }).addTo(map);
            
            map.fitBounds(bounds);
            document.getElementById('statusLine').innerText = "الحالة: تم دمج صورة الطقس";
        };
        reader.readAsDataURL(file);
    };

    // 6. التعامل مع الأشكال المرسومة وتلوينها حسب الاختيار
    map.on(L.Draw.Event.CREATED, function (e) {
        var layer = e.layer;
        var severityColor = document.getElementById('severity').value;
        
        // تطبيق التنسيق بناءً على الدرجة المختارة
        layer.setStyle({
            fillColor: severityColor,
            fillOpacity: 0.5,
            color: "#333",
            weight: 2
        });
        
        drawnItems.addLayer(layer);
        document.getElementById('statusLine').innerText = "الحالة: تم إضافة منطقة تحذير";
    });

    // 7. تصدير البيانات بصيغة GeoJSON
    function downloadJSON() {
        var data = drawnItems.toGeoJSON();
        if (data.features.length === 0) {
            alert("يرجى رسم منطقة واحدة على الأقل قبل التصدير.");
            return;
        }
        var blob = new Blob([JSON.stringify(data)], {type: 'application/json'});
        var url = URL.createObjectURL(blob);
        var link = document.createElement('a');
        link.href = url;
        link.download = 'Jordan_Weather_Zones_2026.geojson';
        link.click();
    }

    // 8. مسح الخريطة
    function resetMap() {
        if(confirm("سيتم حذف جميع الرسومات والصور المرفوعة، هل أنت متأكد؟")) {
            drawnItems.clearLayers();
            if(imgOverlay) map.removeLayer(imgOverlay);
            document.getElementById('statusLine').innerText = "الحالة: تم تصفير الخريطة";
        }
    }

    // معالجة مشكلة تحميل الخريطة في المتصفحات الحديثة
    window.onload = function() {
        setTimeout(function() {
            map.invalidateSize();
        }, 400);
    };
</script>

</body>
</html>
